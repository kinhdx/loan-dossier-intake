name: eval

# Runs against the model API and spends money, so it is started by hand rather than on every push.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Extraction and answer model
        default: claude-opus-5-5
      suite:
        description: Evaluation suite
        type: choice
        options: [idp, rag, retrieval]
        default: idp

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run intake eval "$SUITE" --model "$MODEL"
        env:
          SUITE: ${{ inputs.suite }}
          MODEL: ${{ inputs.model }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: reports/
